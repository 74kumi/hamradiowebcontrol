<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
  <title>ChaosComms Login</title>
</head>
<body>
  <main class="shell login-shell">
    <section class="card login-card">
      <p class="eyebrow">CHAOSCOMMS</p>
      <h1>Log in</h1>
      <p class="muted">LAN radio monitoring interface</p>
      <form id="login-form" class="settings-control">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required value="admin">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required autofocus>
        <button class="audio-toggle" type="submit">Log in</button>
        <p id="login-error" class="error-text" role="alert"></p>
      </form>
    </section>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/v1/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      if (response.ok) {
        window.location.assign("/");
      } else {
        document.getElementById("login-error").textContent = "Invalid credentials or login is not configured.";
      }
    });
  </script>
</body>
</html>
